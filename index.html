];

const SAVE_KEY='thecage_save_v1';

const SUPABASE_URL='https://onjtrzpcehdjhutxfqby.supabase.co';

/* ================= USER ================= */

function tgUser(){
 return tg?.initDataUnsafe?.user || null;
}

function playerId(){
 const u=tgUser();
 return u ? String(u.id) : null;
}

function playerName(){
 const u=tgUser();
 return u?.username || u?.first_name || 'Игрок';
}

/* ================= STATE ================= */

function rnd(a,b){
 return a+Math.random()*(b-a);
}

function pick(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

function genCode(){
 const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let s='';
 for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];
 return s;
}

function defaultState(){
 const now=Date.now();

 return {
   v:now,
   speed:1,
   lastReal:now,
   balance:250,
   lastCollect:now,

   farms:[
     {key:'home_server',lvl:1,heat:0,cd:0}
   ],

   vassals:[],
   owner:null,

   immunity:0,
   shieldUntil:now+24*H,
   shieldTier:'NOVICE',
   shieldCd:0,
   allCd:0,

   refCode:genCode(),
   refCount:0,

   bots:[],

   nextRaid:now+26*H,
   lastMarket:now,

   stats:{
     collected:0,
     taxesEarned:0,
     taxesPaid:0,
     purch:0,
     ransoms:0,
     raids:0
   },

   journal:[]
 };
}

let S=load();

function load(){
 try{
   const raw=localStorage.getItem(SAVE_KEY);

   if(raw){
     const s=JSON.parse(raw);

     s.lastReal=Date.now();

     if(!s.refCode)s.refCode=genCode();
     if(!s.vassals)s.vassals=[];
     if(!s.stats)s.stats={collected:0,taxesEarned:0,taxesPaid:0,purch:0,ransoms:0,raids:0};
     if(!s.journal)s.journal=[];
     if(!s.farms)s.farms=[];

     return s;
   }
 }catch(e){
   console.error(e);
 }

 return defaultState();
}

function save(){
 S.savedReal=Date.now();

 try{
   localStorage.setItem(
     SAVE_KEY,
     JSON.stringify(S)
   );
 }catch(e){}
}

/* ================= SUPABASE ================= */

async function syncPlayer(){

 const id=playerId();

 if(!id){
   console.log('Telegram user не найден');
   return null;
 }

 const username=playerName();

 const {data,error}=await sb
   .from('players')
   .upsert({
     id:id,
     username:username,
     ref_code:S.refCode,
     coins:Math.floor(S.balance),
     income:Math.floor(totalIncome()),
     market_value:Math.floor(myValue())
   },{
     onConflict:'id'
   })
   .select()
   .single();

 if(error){
   console.error('Supabase sync error:',error);
   return null;
 }

 return data;
}


/* ================= REFERRAL ================= */

async function processReferral(){

 const id=playerId();

 if(!id)return;

 const startParam=tg?.initDataUnsafe?.start_param;

 if(!startParam)return;

 if(!startParam.startsWith('ref_'))return;

 const code=startParam.substring(4).trim();

 if(!code)return;

 try{

   const {data:me,error:meError}=await sb
     .from('players')
     .select('id,vassal_of')
     .eq('id',id)
     .maybeSingle();

   if(meError){
     console.error(meError);
     return;
   }

   /* уже есть хозяин */
   if(me?.vassal_of)return;

   /* ищем владельца реферального кода */

   const {data:owner,error:ownerError}=await sb
     .from('players')
     .select('id,username')
     .eq('ref_code',code)
     .maybeSingle();

   if(ownerError){
     console.error(ownerError);
     return;
   }

   if(!owner){
     console.log('Владелец реферального кода не найден');
     return;
   }

   /* нельзя пригласить самого себя */

   if(String(owner.id)===String(id)){
     console.log('Самореферал запрещён');
     return;
   }

   /* назначаем владельца */

   const {error:updateError}=await sb
     .from('players')
     .update({
       vassal_of:String(owner.id)
     })
     .eq('id',id)
     .is('vassal_of',null);

   if(updateError){
     console.error('Referral update error:',updateError);
     return;
   }

   /* локально показываем владельца */

   S.owner={
     name:owner.username || 'Игрок',
     id:String(owner.id),
     price:myValue(),
     since:S.v
   };

   S.refCount=0;

   log(
     'REF_JOIN',
     0,
     'вассал @'+(owner.username || 'Игрок')
   );

   save();

   toast(
     '⛓ ТЫ СТАЛ ВАССАЛОМ @'+(owner.username || 'Игрок'),
     'good'
   );

   render();

 }catch(e){
   console.error('Referral error:',e);
 }
}


/* ================= DATABASE DATA ================= */

async function loadRealMarket(){

 const id=playerId();

 if(!id)return;

 const {data,error}=await sb
   .from('players')
   .select('id,username,coins,income,market_value,vassal_of,created_at')
   .is('vassal_of',null)
   .neq('id',id)
   .order('income',{
     ascending:false
   })
   .limit(20);

 if(error){
   console.error('Market error:',error);
   return;
 }

 S.bots=(data||[]).map(p=>({

   id:String(p.id),

   name:p.username || 'Игрок',

   income:Number(p.income||10),

   market_value:Number(
     p.market_value ||
     Math.max(240,Number(p.income||10)*24)
   ),

   shielded:false,

   shieldUntil:0,

   degraded:false,

   subs:[]
 }));

 renderMarket();
}


/* ================= ECONOMY ================= */

function card(key){
 return CARDS.find(c=>c.key===key);
}

function farmIncome(f){

 const c=card(f.key);

 return c.income*
   (1+0.35*(f.lvl-1))*
   (f.heat>=100?0.3:1);
}

function synergyMult(){

 const cnt={};

 S.farms.forEach(f=>{
   const c=card(f.key);

   if(!c)return;

   cnt[c.rarity]=(cnt[c.rarity]||0)+1;
 });

 const n=Math.max(
   0,
   ...Object.values(cnt)
 );

 return 1+0.05*Math.min(
   Math.max(n-1,0),
   4
 );
}

function personalIncome(){

 return S.farms.reduce(
   (a,f)=>a+farmIncome(f),
   0
 )*synergyMult();
}

function taxOf(node,lvl){

 let t=node.income*
   Math.pow(0.25,lvl);

 (node.subs||[]).forEach(
   s=>t+=taxOf(s,lvl+1)
 );

 return t;
}

function taxIncome(){

 return S.vassals.reduce(
   (a,v)=>a+taxOf(v,1),
   0
 );
}

function totalIncome(){

 return personalIncome()+taxIncome();
}

function upgradeCost(f){

 return Math.round(
   card(f.key).price*
   0.5*
   Math.pow(1.7,f.lvl-1)
 );
}

function botPrice(b){

 return Math.round(
   (b.market_value || b.income*24)
 );
}

function ransomCost(){

 if(!S.owner)return 0;

 const hrs=(S.v-S.owner.since)/H;

 return Math.round(
   S.owner.price*
   1.5*
   (1+0.02*hrs)
 );
}

function myValue(){

 return Math.round(
   personalIncome()*24
 );
}

function pendingCollect(){

 const elapsed=Math.min(
   S.v-S.lastCollect,
   12*H
 );

 return totalIncome()/H*elapsed;
}


/* ================= HELPERS ================= */

function fmt(n){

 n=Math.floor(n);

 if(n>=1e9)
   return (n/1e9).toFixed(2)+'B';

 if(n>=1e6)
   return (n/1e6).toFixed(2)+'M';

 if(n>=1e3)
   return (n/1e3).toFixed(1)+'K';

 return ''+n;
}

function fmtT(ms){

 if(ms<=0)return '00:00:00';

 const s=Math.floor(ms/1000);

 const h=String(
   Math.floor(s/3600)
 ).padStart(2,'0');

 const m=String(
   Math.floor(s%3600/60)
 ).padStart(2,'0');

 const ss=String(
   s%60
 ).padStart(2,'0');

 return h+':'+m+':'+ss;
}

function toast(msg,kind){

 const d=document.createElement('div');

 d.className='toast'+
   (kind?' '+kind:'');

 d.textContent=msg;

 document
   .getElementById('toasts')
   .appendChild(d);

 setTimeout(
   ()=>d.remove(),
   3200
 );
}

function log(type,amount,note){

 S.journal.unshift({
   t:S.v,
   type,
   amount:Math.round(amount),
   note
 });

 if(S.journal.length>40)
   S.journal.pop();
}

let AC=null;

function beep(f){

 try{

   AC=AC||
     new(window.AudioContext||
     window.webkitAudioContext)();

   const o=AC.createOscillator();
   const g=AC.createGain();

   o.frequency.value=f||660;
   o.type='square';

   g.gain.value=0.03;

   o.connect(g);
   g.connect(AC.destination);

   o.start();

   g.gain.exponentialRampToValueAtTime(
     0.0001,
     AC.currentTime+0.08
   );

   o.stop(
     AC.currentTime+0.09
   );

 }catch(e){}
}


/* ================= ACTIONS ================= */

function collect(){

 const p=pendingCollect();

 if(p<1)return;

 const elapsed=Math.min(
   S.v-S.lastCollect,
   12*H
 );

 const personal=personalIncome();
 const tax=taxIncome();

 const gross=
   (personal+tax)/H*
   elapsed;

 let taxPay=0;

 if(S.owner){
   taxPay=
     gross*
     (personal/totalIncome())*
     0.25;
 }

 const net=gross-taxPay;

 S.balance+=net;

 S.stats.collected+=net;

 S.stats.taxesEarned+=
   gross*(tax/totalIncome());

 S.stats.taxesPaid+=taxPay;

 S.lastCollect=S.v;

 log(
   'COLLECT',
   net,
   S.owner?
   ('налог хозяину −'+fmt(taxPay)):
   ''
 );

 toast(
   '+'+fmt(net)+' C₵ СОБРАНО',
   'good'
 );

 beep(880);

 save();

 syncPlayer();

 render();
}


function buyCard(key){

 const c=card(key);

 if(S.balance<c.price){
   toast('НЕДОСТАТОЧНО C₵','bad');
   return;
 }

 S.balance-=c.price;

 S.farms.push({
   key,
   lvl:1,
   heat:0,
   cd:0
 });

 log(
   'FARM_BUY',
   -c.price,
   c.name
 );

 toast(
   'NODE INSTALLED: '+c.name,
   'good'
 );

 beep(720);

 save();

 syncPlayer();

 render();
}


function upgradeFarm(i){

 const f=S.farms[i];

 const cost=upgradeCost(f);

 if(S.balance<cost){
   toast('НЕДОСТАТОЧНО C₵','bad');
   return;
 }

 S.balance-=cost;

 f.lvl++;

 log(
   'UPGRADE',
   -cost,
   card(f.key).name+
   ' → LVL '+f.lvl
 );

 toast(
   'УЛУЧШЕНО: '+
   card(f.key).name+
   ' LVL '+f.lvl,
   'good'
 );

 beep(760);

 save();

 syncPlayer();

 render();
}


function resetHeat(i){

 const f=S.farms[i];

 if(
   S.v<f.cd||
   f.heat<=0
 )return;

 f.heat=0;

 f.cd=
   S.v+
   30*1000;

 beep(500);

 save();

 render();
}


function resetAllHeat(){

 if(S.v<S.allCd){

   toast(
     'КУЛДАУН '+
     fmtT(S.allCd-S.v),
     'bad'
   );

   return;
 }

 S.farms.forEach(
   f=>f.heat=0
 );

 S.allCd=
   S.v+
   5*60*1000;

 toast(
   'ВСЕ УЗЛЫ ПЕРЕЗАГРУЖЕНЫ',
   'good'
 );

 beep(520);

 save();

 render();
}


/* ================= REAL PLAYER PURCHASE ================= */

async function buyBot(id){

 const myId=playerId();

 if(!myId){
   toast('ОТКРОЙ ИГРУ В TELEGRAM','bad');
   return;
 }

 const b=S.bots.find(
   x=>String(x.id)===String(id)
 );

 if(!b)return;

 const price=botPrice(b);

 if(S.balance<price){
   toast('НЕДОСТАТОЧНО C₵','bad');
   return;
 }

 if(String(id)===String(myId)){
   toast('НЕЛЬЗЯ КУПИТЬ СЕБЯ','bad');
   return;
 }

 try{

   /*
    сначала проверяем,
    что игрок ещё свободен
   */

   const {data:target,error:targetError}=
     await sb
       .from('players')
       .select('id,username,income,market_value,vassal_of')
       .eq('id',String(id))
       .maybeSingle();

   if(targetError){
     console.error(targetError);
     toast('ОШИБКА СЕРВЕРА','bad');
     return;
   }

   if(!target){
     toast('ИГРОК НЕ НАЙДЕН','bad');
     await loadRealMarket();
     return;
   }

   if(target.vassal_of){
     toast('ЭТОТ ИГРОК УЖЕ В ЦЕПИ','bad');
     await loadRealMarket();
     return;
   }

   /*
    назначаем текущего игрока
    владельцем выбранного игрока
   */

   const {error:updateError}=
     await sb
       .from('players')
       .update({
         vassal_of:myId
       })
       .eq('id',String(id))
       .is('vassal_of',null);

   if(updateError){
     console.error(updateError);
     toast('НЕ УДАЛОСЬ КУПИТЬ ИГРОКА','bad');
     return;
   }

   /*
    только после успешной базы
    списываем деньги локально
   */

   S.balance-=price;

   S.vassals.push({
     id:String(target.id),
     name:target.username||'Игрок',
     income:Number(target.income||10),
     lvl:1,
     subs:[]
   });

   S.stats.purch++;

   log(
     'PLAYER_BUY',
     -price,
     '@'+(target.username||'Игрок')
   );

   toast(
     'NODE ACQUIRED: @'+
     (target.username||'Игрок'),
     'good'
   );

   beep(980);

   save();

   await syncPlayer();

   await loadRealMarket();

   render();

 }catch(e){

   console.error(e);

   toast(
     'ОШИБКА ПОКУПКИ',
     'bad'
   );
 }
}

   );

 );

 syncPlayer();

 render();
}

/* ================= GAME LOOP ================= */

async function tick(){

 const now=Date.now();

 const dt=
   now-
   S.lastReal;

 S.lastReal=now;

 S.v+=
   dt*
   S.speed;

 S.farms.forEach(f=>{

   if(f.heat<100){

     f.heat=
       Math.min(
         100,
         f.heat+
         dt*
         S.speed*
         100/
         86400000
       );
   }
 });

 /*
  реальный рынок обновляем
  каждые 30 секунд интерфейса
 */

 if(
   S.v-
   S.lastMarket>
   30000
 ){

   S.lastMarket=S.v;

   loadRealMarket();
 }

 const unprotected=
   S.v>S.shieldUntil &&
   S.v>S.immunity;

 if(
   unprotected&&
   S.v>S.nextRaid&&
   personalIncome()>=30
 ){

   if(Math.random()<0.5){

     doRaid();

   }else{

     S.nextRaid=
       S.v+
       1*H;
   }
 }

 render();
}


/* ================= START DATABASE ================= */

async function startDatabase(){

 try{

   await syncPlayer();

   /*
    сначала создаём игрока,
    потом обрабатываем реферал
   */

   await processReferral();

   /*
    после реферала
    загружаем настоящий рынок
   */

   await loadRealMarket();

 }catch(e){

   console.error(
     'Database startup error:',
     e
   );
 }
}
