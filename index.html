<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>THE CAGE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050509;
  --panel:#0b0b12;
  --panel2:#10101a;
  --line:#222232;
  --text:#f3f4f6;
  --muted:#737386;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --green:#22c55e;
  --red:#ef4444;
  --violet:#8b5cf6;
  --violet2:#a78bfa;
  --orange:#f59e0b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.mono,
.finc,
.price,
.cost,
.jitem,
.mini,
.ds,
.inf{
  font-family:monospace;
}

#app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:80px;
}


/* DESKTOP LAYOUT */

@media(min-width:960px){
  #app{max-width:1240px}
  .nav{max-width:1240px}
  .farmGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shopStrip{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(min-width:1360px){
  .farmGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .shopStrip{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* FULLSCREEN BUTTON */

#fsBtn{
  display:none;
  position:fixed;
  left:12px;
  bottom:72px;
  z-index:60;
  border:1px solid #303044;
  background:#0b0b12;
  color:#9ca3af;
  padding:9px 11px;
  font:bold 10px monospace;
}

#fsBtn.on{
  color:var(--orange);
  border-color:rgba(245,158,11,.5);
}

@media(hover:hover) and (pointer:fine){
  #fsBtn{display:block}
}

/* CC-DROP SCENE */

#ccScene{
  position:fixed;
  inset:0;
  z-index:1500;
  display:none;
  background:radial-gradient(ellipse at center,rgba(6,26,14,.55),rgba(3,5,8,.88));
}

#ccScene.on{
  display:block;
}

#ccStage{
  position:absolute;
  inset:0;
  overflow:hidden;
}

#ccCoin{
  position:absolute;
  left:0;
  top:0;
  width:64px;
  height:64px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font:bold 22px monospace;
  color:#052e12;
  background:radial-gradient(circle at 32% 28%,#bbf7d0,#22c55e 55%,#14532d);
  box-shadow:
    0 0 26px rgba(34,197,94,.55),
    inset 0 0 0 3px rgba(255,255,255,.18);
  will-change:transform;
  z-index:1;
}

#ccCoin span{
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}

#ccOffer{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.92);
  width:min(92vw,360px);
  border:1px solid rgba(34,197,94,.45);
  background:linear-gradient(180deg,#0a1510,#070b0d);
  padding:18px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .5s,transform .5s;
  box-shadow:0 0 50px rgba(34,197,94,.2);
  z-index:2;
}

#ccScene.offer #ccOffer{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.ccOfferTag{
  color:#4ade80;
  font:9px monospace;
  letter-spacing:2px;
  margin-bottom:12px;
}

.ccCoinBig{
  width:56px;
  height:56px;
  margin:0 auto 10px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font:bold 20px monospace;
  color:#052e12;
  background:radial-gradient(circle at 32% 28%,#bbf7d0,#22c55e 55%,#14532d);
  box-shadow:0 0 22px rgba(34,197,94,.5);
}

.ccValue{
  color:#9ca3af;
  font:8px monospace;
  letter-spacing:1px;
}

.ccValueNum{
  color:#4ade80;
  font:bold 24px monospace;
  margin:5px 0 14px;
}

#ccAdBtn{
  width:100%;
  border:1px solid rgba(34,197,94,.6);
  background:linear-gradient(180deg,rgba(34,197,94,.28),rgba(34,197,94,.1));
  color:#86efac;
  padding:14px;
  font:bold 12px monospace;
}

#ccAdBtn:not(:disabled){
  animation:pulse 1.6s infinite;
}

#ccAdBtn b{
  color:#bbf7d0;
}

#ccTakeBtn{
  width:100%;
  margin-top:8px;
  border:1px solid var(--line);
  background:#0d0d15;
  color:#9ca3af;
  padding:11px;
  font:bold 10px monospace;
}

#ccTakeBtn b{
  color:#d1d5db;
}

#ccTakeBtn .ccNoAd{
  display:block;
  color:#626276;
  font:8px monospace;
  margin-top:3px;
}

.ccHint{
  margin-top:10px;
  color:#626276;
  font:8px monospace;
}

/* TEST AD STUB */

.adTest{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(2,4,3,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.adTestCard{
  width:min(92vw,340px);
  border:1px solid rgba(34,197,94,.4);
  background:#0a120d;
  padding:24px;
  text-align:center;
}

.adTestTag{
  color:var(--orange);
  font:bold 9px monospace;
  letter-spacing:2px;
}

.adTestSpin{
  width:40px;
  height:40px;
  margin:16px auto;
  border:3px solid #14532d;
  border-top-color:#22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.adTestCount{
  color:#4ade80;
  font:bold 28px monospace;
  margin-top:6px;
}

.adTestNote{
  color:var(--muted);
  font:9px monospace;
  margin-top:8px;
}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#030305;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  transition:opacity .6s;
}

.bootBox{
  width:100%;
  max-width:520px;
  border:1px solid #29293b;
  background:#07070d;
  padding:22px;
  box-shadow:0 0 40px rgba(59,130,246,.08);
}

.bootTitle{
  color:var(--blue2);
  font-family:monospace;
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

#bootText{
  color:#8da0bd;
  white-space:pre-line;
  font:12px/1.8 monospace;
}

#bootEnter{
  display:none;
  color:var(--green);
  font:11px monospace;
  margin-top:18px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.3}
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,9,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.headerTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font:bold 18px monospace;
  letter-spacing:2px;
}

.logo span{
  color:var(--red);
}

.balance{
  color:var(--blue2);
  font:bold 16px monospace;
}

.headerStats{
  display:flex;
  gap:8px;
  margin-top:9px;
  flex-wrap:wrap;
}

.hstat{
  border:1px solid var(--line);
  background:var(--panel);
  padding:6px 9px;
  font:10px monospace;
  color:#9ca3af;
}

.hstat b{
  color:#fff;
}

#hIncome{
  color:var(--green);
}

#hShield{
  color:var(--green);
}

#hShield.none{
  color:var(--red);
}

/* SCREENS */

.screen{
  display:none;
  padding:12px;
}

.screen.active{
  display:block;
}

/* PANELS */

.panel{
  border:1px solid var(--line);
  background:var(--panel);
  padding:13px;
  margin-bottom:12px;
}

.ptitle{
  font:10px monospace;
  color:#9292a8;
  letter-spacing:1.2px;
  margin-bottom:10px;
}

.sectTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:15px 0 8px;
  font:bold 10px monospace;
  color:#8d8da0;
  letter-spacing:1px;
}

.mini{
  color:var(--muted);
  font-size:9px;
}

/* BUTTONS */

#collectBtn{
  width:100%;
  border:1px solid rgba(34,197,94,.45);
  background:rgba(34,197,94,.08);
  color:var(--green);
  padding:14px;
  font:bold 13px monospace;
}

#collectBtn.pulse{
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:0 0 22px rgba(34,197,94,.22);
  }
}

.fbtn,
.buyBtn,
.dangerBtn{
  border:1px solid var(--line);
  background:#11111b;
  color:#d1d5db;
  padding:9px 12px;
  font:bold 10px monospace;
}

.fbtn.primary,
.buyBtn{
  border-color:rgba(59,130,246,.4);
  color:var(--blue2);
  background:rgba(59,130,246,.07);
}

.fbtn.hot,
.dangerBtn{
  border-color:rgba(239,68,68,.4);
  color:#f87171;
  background:rgba(239,68,68,.06);
}

.dangerBtn{
  width:100%;
  margin-top:10px;
  padding:13px;
}

#speedBtn{
  position:fixed;
  right:12px;
  bottom:72px;
  z-index:60;
  border:1px solid #303044;
  background:#0b0b12;
  color:#9ca3af;
  padding:9px 11px;
  font:bold 10px monospace;
}

#speedBtn.on{
  color:var(--orange);
  border-color:rgba(245,158,11,.5);
}

/* CAPACITY */

#capBar{
  height:5px;
  background:#191923;
  margin-top:10px;
  overflow:hidden;
}

#capFill{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--violet));
}

.capLabel{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font:8px monospace;
  margin-top:5px;
}

/* OWNER */

.ownerBanner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.05);
  padding:12px;
  margin-bottom:12px;
}

.ownerBanner .t{
  color:#f87171;
  font:bold 11px monospace;
}

.ownerBanner .s{
  color:var(--muted);
  font:8px monospace;
  margin-top:4px;
}

/* FARMS */

.farmGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.fcard{
  position:relative;
  border:1px solid color-mix(in srgb,var(--rc) 35%,#222);
  background:var(--panel);
  padding:11px;
  overflow:hidden;
}

.fcard.overheat{
  border-color:rgba(239,68,68,.5);
}

.flvl{
  color:var(--rc);
  font:bold 9px monospace;
}

.fname{
  color:#fff;
  font:bold 11px monospace;
  margin-top:5px;
}

.frar{
  color:var(--rc);
  font:8px monospace;
  letter-spacing:1px;
  margin-top:3px;
}

.finc{
  color:var(--blue2);
  font:bold 12px monospace;
  margin-top:8px;
}

.heatBar{
  height:4px;
  background:#191923;
  margin-top:9px;
}

.heatFill{
  height:100%;
  background:var(--orange);
}

.heatLabel{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font:7px monospace;
  margin-top:4px;
}

.fbtns{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.fbtns .fbtn{
  flex:1;
}

/* SHOP */

.shopStrip{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.scard{
  background:#090910;
  padding:10px;
}

/* MARKET */

.mcard{
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
  margin-bottom:8px;
}

.mcard .top,
.mcard .mid,
.mcard .bot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.mcard .nm{
  font:bold 10px monospace;
}

.st{
  font:bold 8px monospace;
}

.online{
  color:var(--green);
}

.mcard .mid{
  color:var(--muted);
  font:9px monospace;
  margin-top:10px;
}

.mcard .mid b{
  color:#ddd;
}

.mcard .bot{
  margin-top:11px;
}

.pr{
  color:var(--violet2);
  font:bold 12px monospace;
}

/* CHAIN */

.chainNode{
  border-left:2px solid var(--violet);
  background:var(--panel);
  padding:11px;
  margin-bottom:6px;
}

.chainNode.l2{
  margin-left:18px;
  border-left-color:#475569;
}

.chainNode .nm{
  font:bold 11px monospace;
}

.inf{
  color:var(--muted);
  font-size:8px;
  margin-top:5px;
}

.inf b{
  color:var(--green);
}

.freeNode{
  border:1px solid rgba(34,197,94,.25);
  background:rgba(34,197,94,.04);
  color:var(--green);
  padding:12px;
  font:bold 10px monospace;
  margin-bottom:12px;
}

.ransomPanel{
  border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.04);
  padding:13px;
  margin-bottom:12px;
}

.cost{
  color:#f87171;
  font:bold 18px monospace;
}

.refBox{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.refBox .link{
  min-width:0;
  flex:1;
  border:1px solid var(--line);
  background:#06060b;
  padding:10px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#7f8799;
  font:8px monospace;
}

/* SHIELDS */

.shieldRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid var(--line);
  padding:11px 0;
}

.shieldRow .nm{
  font:bold 11px monospace;
}

.shieldRow .ds{
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

/* STATS */

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.statCell{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.statCell .v{
  color:#fff;
  font:bold 16px monospace;
}

.statCell .l{
  color:var(--muted);
  font:8px monospace;
  margin-top:3px;
}

/* JOURNAL */

.jitem{
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding:8px 0;
  font-size:9px;
}

.nt{
  color:#9ca3af;
}

.plus{
  color:var(--green);
}

.minus{
  color:var(--red);
}

/* TOAST */

#toasts{
  position:fixed;
  left:12px;
  right:12px;
  top:70px;
  z-index:1000;
  pointer-events:none;
}

.toast{
  max-width:500px;
  margin:0 auto 7px;
  border:1px solid #333343;
  background:#11111a;
  padding:10px;
  color:#ddd;
  font:bold 10px monospace;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.toast.good{
  border-color:rgba(34,197,94,.4);
  color:var(--green);
}

.toast.bad{
  border-color:rgba(239,68,68,.4);
  color:#f87171;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:55;
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(7,7,12,.97);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.tab{
  border:0;
  background:transparent;
  color:#626276;
  padding:11px 4px;
  font:bold 9px monospace;
}

.tab.active{
  color:var(--blue2);
}

@media(max-width:420px){
  .farmGrid,
  .shopStrip{
    grid-template-columns:1fr;
  }
}
</style>
<base target="_blank">
</head>

<body>

<div id="boot">
  <div class="bootBox">
    <div class="bootTitle">THE CAGE // SYSTEM BOOT</div>
    <div id="bootText"></div>
    <div id="bootEnter">[ НАЖМИТЕ ДЛЯ ВХОДА ]</div>
  </div>
</div>

<div id="app">

<header class="header">

  <div class="headerTop">

    <div class="logo">
      THE <span>CAGE</span>
    </div>

    <div id="hBalance" class="balance">
      250 C₵
    </div>

  </div>

  <div class="headerStats">

    <div class="hstat">
      ДОХОД:
      <b id="hIncome">+10/ч</b>
    </div>

    <div id="hShield" class="hstat">

    </div>

    <div id="hAds" class="hstat">
      🎁 CC 8/8
    </div>

  </div>

</header>

<main>

<section id="scr-terminal" class="screen active"></section>
<section id="scr-market" class="screen"></section>
<section id="scr-chain" class="screen"></section>
<section id="scr-profile" class="screen"></section>

</main>

</div>

<div id="toasts"></div>

<div id="ccScene">
  <div id="ccStage">
    <div id="ccCoin"><span>C₵</span></div>
  </div>
  <div id="ccOffer">
    <div class="ccOfferTag">CC-DROP · <span id="ccUsed">0/8</span></div>

  </div>
</div>

<button id="speedBtn" onclick="toggleSpeed()">
  
</button>

<button id="fsBtn" onclick="toggleFullscreen()">
  ⛶ ПОЛНЫЙ ЭКРАН
</button>

<nav class="nav">

<button class="tab active" data-t="terminal" onclick="go('terminal')">
  ◈<br>ТЕРМИНАЛ
</button>

<button class="tab" data-t="market" onclick="go('market')">
  ◇<br>РЫНОК
</button>

<button class="tab" data-t="chain" onclick="go('chain')">
  ⛓<br>ЦЕПЬ
</button>

<button class="tab" data-t="profile" onclick="go('profile')">
  ◎<br>ПРОФИЛЬ
</button>

</nav>

<script>
'use strict';

/* ================= DATA ================= */

const CARDS=[
 {key:'home_server',name:'ДОМАШНИЙ СЕРВЕР',rarity:'common',income:10,price:500},
 {key:'usb_miner',name:'USB-МАЙНЕР',rarity:'common',income:25,price:1200},
 {key:'garage_node',name:'ГАРАЖНЫЙ УЗЕЛ',rarity:'common',income:60,price:2800},
 {key:'datacenter_rack',name:'СТОЙКА ДЦ',rarity:'rare',income:150,price:7500},
 {key:'neuro_client',name:'НЕЙРО-КЛИЕНТ',rarity:'rare',income:380,price:19000},
 {key:'quantum_module',name:'КВАНТОВЫЙ МОДУЛЬ',rarity:'rare',income:900,price:48000},
 {key:'bunker_farm',name:'БУНКЕРНАЯ ФЕРМА',rarity:'epic',income:2200,price:125000},
 {key:'ai_core',name:'AI CORE',rarity:'epic',income:5500,price:320000},

/* ================= HELPERS ================= */

function rnd(a,b){
 return a+Math.random()*(b-a);
}

function pick(arr){
 return arr[
   Math.floor(Math.random()*arr.length)
 ];
}

function log(type,amount,note){

 if(!Array.isArray(S.journal))
   S.journal=[];

 S.journal.unshift({
   type,
   amount,
   note,
   time:Date.now()
 });

 if(S.journal.length>30)
   S.journal.length=30;
}

function toast(msg,kind){

 const box=document.getElementById('toasts');

 if(!box)return;

 const d=document.createElement('div');

 d.className='toast'+(kind?' '+kind:'');

 d.textContent=msg;

 box.appendChild(d);

 setTimeout(
   ()=>d.remove(),
   3200
 );
}

function fmt(n){

 n=Math.floor(Number(n)||0);

 if(n>=1e9)
   return (n/1e9).toFixed(2)+'B';

 if(n>=1e6)
   return (n/1e6).toFixed(2)+'M';

 if(n>=1e3)
   return (n/1e3).toFixed(1)+'K';

 return ''+n;
}

function fmtT(ms){

 if(ms<=0)
   return '00:00:00';

 const s=Math.floor(ms/1000);

 const h=String(
   Math.floor(s/3600)
 ).padStart(2,'0');

 const m=String(
   Math.floor((s%3600)/60)
 ).padStart(2,'0');

 const ss=String(
   s%60
 ).padStart(2,'0');

 return h+':'+m+':'+ss;
}

let AC=null;

function beep(f){

 try{

   AC=AC||new(
     window.AudioContext||
     window.webkitAudioContext
   )();

   const o=AC.createOscillator();
   const g=AC.createGain();

   o.frequency.value=f||660;
   o.type='square';

   g.gain.value=.03;

   o.connect(g);
   g.connect(AC.destination);

   o.start();

   g.gain.exponentialRampToValueAtTime(
     .0001,
     AC.currentTime+.08
   );

   o.stop(AC.currentTime+.09);

 }catch(e){}
}

/* ================= ECONOMY ================= */

function card(key){
 return CARDS.find(c=>c.key===key);
}

function farmIncome(f){

 const c=card(f.key);

 if(!c)return 0;

 return c.income*
   (1+.35*(f.lvl-1))*
   (f.heat>=100?.3:1);
}

function synergyMult(){

 const cnt={};

 S.farms.forEach(f=>{

   const c=card(f.key);

   if(!c)return;

   cnt[c.rarity]=(cnt[c.rarity]||0)+1;
 });

 const n=Math.max(
   0,
   ...Object.values(cnt)
 );

 return 1+
   .05*
   Math.min(
     Math.max(n-1,0),
     4
   );
}

function personalIncome(){

 return S.farms.reduce(
   (a,f)=>a+farmIncome(f),
   0
 )*synergyMult();
}

function taxOf(node,lvl){

 let t=
   Number(node.income||0)*
   Math.pow(.25,lvl);

 (node.subs||[]).forEach(
   s=>{
     t+=taxOf(s,lvl+1);
   }
 );

 return t;
}

function taxIncome(){

 return S.vassals.reduce(
   (a,v)=>a+taxOf(v,1),
   0
 );
}

function totalIncome(){

 return personalIncome()+taxIncome();
}

function upgradeCost(f){

 const c=card(f.key);

 if(!c)return 0;

 return Math.round(
   c.price*
   .5*
   Math.pow(1.7,f.lvl-1)
 );
}

function botPrice(b){

 return Math.round(
   b.market_value||
   b.income*24||
   240
 );
}

function ransomCost(){

 if(!S.owner)
   return 0;

 const hrs=(S.v-S.owner.since)/H;

 return Math.round(
   S.owner.price*
   1.5*
   (1+.02*hrs)
 );
}

function myValue(){

 return Math.round(
   personalIncome()*24
 );
}

function pendingCollect(){

 const elapsed=
   Math.min(
     Math.max(
       S.v-S.lastCollect,
       0
     ),
     12*H
   );

 return totalIncome()/H*elapsed;
}

function collect(){

 if(p<1)return;

 const elapsed=
   Math.min(
     Math.max(
       S.v-S.lastCollect,
       0
     ),
     12*H
   );

 const personal=personalIncome();
 const tax=taxIncome();

 const gross=
   (personal+tax)/
   H*
   elapsed;

 let taxPay=0;

 if(S.owner&&totalIncome()>0){

   taxPay=
     gross*
     (
       personal/
       totalIncome()
     )*
     .25;
 }

 const net=
   Math.max(
     0,
     gross-taxPay
   );

 S.balance+=net;

 S.stats.collected+=net;

 if(totalIncome()>0){

   S.stats.taxesEarned+=
     gross*
     (
       tax/
       totalIncome()
     );
 }

 S.stats.taxesPaid+=taxPay;

 S.lastCollect=S.v;

 log(
   'COLLECT',
   net,
   S.owner?
   'налог хозяину −'+fmt(taxPay):
   ''
 );

 toast(
   '+'+
   fmt(net)+
   ' C₵ СОБРАНО',
   'good'
 );

 beep(880);

 save();

 syncPlayer();

 render();
}

const ADS_MAX=8;

function todayKey(){
 const d=new Date();
 return d.getFullYear()+'-'+
   String(d.getMonth()+1).padStart(2,'0')+'-'+
   String(d.getDate()).padStart(2,'0');
}

function ensureAds(){

 if(!S.ads||typeof S.ads!=='object')
   S.ads={day:'',used:0};

 if(typeof S.ads.used!=='number')
   S.ads.used=0;

 if(S.ads.day!==todayKey()){
   S.ads.day=todayKey();
   S.ads.used=0;
 }
}

function adsLeft(){
 ensureAds();
 return Math.max(0,ADS_MAX-S.ads.used);
}

/* ТЕКУЩАЯ стоимость монеты CC — всегда из экономики игры.
   Никаких захардкоженных сумм: берём рыночную стоимость игрока
   (доход/час × 24), она растёт вместе с прогрессом. */
function ccCoinValue(){
 return Math.max(1,Math.round(myValue()));
}

/*
  ПРОВАЙДЕР РЕКЛАМЫ.

  Сейчас подключена тестовая заглушка (3 секунды фейковой рекламы).

  Чтобы подключить реальную Rewarded Ad сеть позже —
  замени тело showRewarded() на вызов SDK (Adsgram, Telegram и т.п.):

    showRewarded(){
      return new Promise(resolve=>{
        AdSDK.show({
          onRewarded:()=>resolve(true),
          onClose:()=>resolve(false),
          onError:()=>resolve(false)
        });
      });
    }

  resolve(true)  — реклама досмотрена, начисляем награду;
  resolve(false) — отмена/ошибка, попытка НЕ тратится.
*/
const AdProvider={
 name:'TEST_STUB',
 showRewarded(){
   return new Promise(resolve=>{
     showTestAd(resolve);
   });
 }
};

function showTestAd(done){

 const ov=document.createElement('div');

 ov.className='adTest';

 ov.innerHTML=
   '<div class="adTestCard">'+
     '<div class="adTestTag">РЕКЛАМА · ТЕСТОВЫЙ РЕЖИМ</div>'+

     '<div class="adTestNote">здесь будет Rewarded Ad</div>'+
   '</div>';

 document.body.appendChild(ov);

 let n=3;

 const iv=setInterval(

     n--;

     const c=

       );

       c.textContent=n;

     if(n<=0){
       clearInterval(iv);
       ov.remove();

 );

const CCScene={
 active:false,
 raf:null,
 lastTs:0,
 offerTo:null,
 x:40,
 y:80,
 vx:180,
 vy:150,
 rot:0,
 nextAt:Date.now()+rnd(45000,120000)

function ccSetButtons(on){
 const a=document.getElementById('ccAdBtn');
 const b=document.getElementById('ccTakeBtn');
 if(a)a.disabled=!on;
 if(b)b.disabled=!on;
}

function ccBounceLoop(ts){

 if(!CCScene.active)
   return;

 const coin=document.getElementById('ccCoin');
 const stage=document.getElementById('ccStage');

 if(!coin||!stage)
   return;

 if(!CCScene.lastTs)
   CCScene.lastTs=ts;

 let dt=(ts-CCScene.lastTs)/1000;

 CCScene.lastTs=ts;

 if(dt>0.05)
   dt=0.05;

 if(dt<=0){
   CCScene.raf=requestAnimationFrame(ccBounceLoop);
   return;
 }

 const W=stage.clientWidth;
 const H=stage.clientHeight;
 const sz=coin.offsetWidth;

 CCScene.x+=CCScene.vx*dt;
 CCScene.y+=CCScene.vy*dt;
 CCScene.rot+=260*dt;

 let sx=1;
 let sy=1;

 if(CCScene.x<=0||CCScene.x>=W-sz){

   CCScene.x=
     Math.max(
       0,
       Math.min(W-sz,CCScene.x)
     );

   CCScene.vx*=-1;
   sx=.82;
   sy=1.14;
 }

 if(CCScene.y<=0||CCScene.y>=H-sz){

   CCScene.y=
     Math.max(
       0,
       Math.min(H-sz,CCScene.y)
     );

   CCScene.vy*=-1;
   sx=1.14;
   sy=.82;
 }

 coin.style.transform=
   'translate('+CCScene.x+'px,'+CCScene.y+'px) '+
   'rotate('+CCScene.rot+'deg) '+
   'scale('+sx+','+sy+')';

 CCScene.raf=requestAnimationFrame(ccBounceLoop);
}

function openCCScene(){

 if(CCScene.active)
   return;

 ensureAds();

 if(adsLeft()<=0)
   return;

 const scene=
   document.getElementById('ccScene');

 if(!scene)
   return;

 CCScene.active=true;
 CCScene.lastTs=0;
 CCScene.rot=0;

 const W=window.innerWidth;
 const H=window.innerHeight;

 CCScene.x=
   rnd(
     20,
     Math.max(40,W-120)
   );

 CCScene.y=
   rnd(
     60,
     Math.max(90,H*0.35)
   );

 CCScene.vx=
   rnd(130,230)*
   (Math.random()<.5?-1:1);

 CCScene.vy=
   rnd(120,210)*
   (Math.random()<.5?-1:1);

 scene.classList.add('on');
 scene.classList.remove('offer');

 ccSetValues();
 ccSetButtons(true);

 const coin=
   document.getElementById('ccCoin');

 if(coin){

   coin.style.transform=
     'translate('+
     CCScene.x+
     'px,'+
     CCScene.y+
     'px)';

 }

 CCScene.raf=requestAnimationFrame(ccBounceLoop);

 clearTimeout(CCScene.offerTo);

 /* монета отскакивает ~4 сек, затем появляется предложение */
 CCScene.offerTo=
   setTimeout(
     ()=>{

       const sc=
         document.getElementById('ccScene');

       if(!sc||!CCScene.active)
         return;

       ccSetValues();
       sc.classList.add('offer');
       beep(660);

     },
     4000
   );

 beep(920);
}

function closeCCScene(){

 CCScene.active=false;

 clearTimeout(CCScene.offerTo);

 if(CCScene.raf)
   cancelAnimationFrame(CCScene.raf);

 const scene=
   document.getElementById('ccScene');

 if(scene){
   scene.classList.remove('on');
   scene.classList.remove('offer');
 }
}

async function ccChoose(kind){

 if(adsLeft()<=0){

 /* суммы считаем в момент выбора —
    всегда актуальная стоимость монеты */
 const v=ccCoinValue();

 if(kind==='ad'){

   ccSetButtons(false);

   const ok=
     await AdProvider.showRewarded();

   if(!ok){
     ccSetButtons(true);
     toast(

     );
     return;
   }

   ccGrant(v,'ad');

 }else{

   ccGrant(v,'take');
 }

function ccGrant(v,kind){

 ensureAds();

 /* оба варианта тратят одну дневную попытку */
 S.ads.used=
   Math.min(
     ADS_MAX,
     S.ads.used+1
   );

 const amount=
   kind==='ad'?
   v:
   Math.max(1,Math.round(v*.25));

 S.balance+=amount;
 S.stats.collected+=amount;
 S.stats.adRewards=(S.stats.adRewards||0)+1;

 if(kind==='ad')
   S.stats.adViews=(S.stats.adViews||0)+1;

 log(
   'CC_DROP',
   amount,
   (
     kind==='ad'?
     'реклама · 100%':
     'монета · 25%'
   )+
   ' · попытка '+
   S.ads.used+
   '/'+ADS_MAX
 );

 toast(
   (
     kind==='ad'?
     '📺 +':
     '🪙 +'
   )+
   fmt(amount)+
   ' C₵ · ПОПЫТКА '+
   S.ads.used+
   '/'+ADS_MAX,
   'good'
 );

 beep(kind==='ad'?1040:880);

 /* следующая сцена — через 90–240 сек реального времени */
 CCScene.nextAt=
   Date.now()+rnd(90000,240000);

 closeCCScene();

 save();
 syncPlayer();
 render();
}

 if(
   !d.fullscreenElement&&

     el.requestFullscreen||

         );

   if(ex)
     ex.call(d);
 }
}

/* ================= GAME LOOP ================= */

async function tick(){

 const now=Date.now();

 let dt=
   now-S.lastReal;

 if(dt<0||dt>60000)
   dt=1000;

 S.lastReal=now;

 S.v+=
   dt*S.speed;

 S.farms.forEach(
   f=>{

     if(f.heat<100){

       f.heat=
         Math.min(
           100,
           f.heat+
           dt*
           S.speed*
           100/
           86400000
         );
     }

   }
 );

 if(
   S.v-S.lastMarket>
   30000
 ){

   S.lastMarket=S.v;

   loadRealMarket();
 }

 const unprotected=
   S.v>S.shieldUntil&&
   S.v>S.immunity;

 if(
   unprotected&&
   S.v>S.nextRaid&&
   personalIncome()>=30
 ){

   if(Math.random()<.5){

     doRaid();

   }else{

     S.nextRaid=
       S.v+
       H;
   }
 }
 /* CC-DROP: реальное время, не игровое */
 ensureAds();

 if(
   !CCScene.active&&
   !document.getElementById('boot')&&
   adsLeft()>0&&
   Date.now()>=CCScene.nextAt
 ){
   openCCScene();
 }

 render();
}

       .map(

}

/* ================= BOOT ================= */

(function(){

 const lines=[
   '> THE CAGE v1.0 // NODE BOOT',
   '> авторизация Telegram......OK',
   '> Supabase connection.......READY',
   '> реестр игроков............READY',
   '> рынок реальных игроков....READY',
   '> щит новичка активирован...24Ч',
   '> ДОБРО ПОЖАЛОВАТЬ В ЦЕПЬ, ОПЕРАТОР'
 ];

 const el=
   document.getElementById(
     'bootText'
   );

 const enter=
   document.getElementById(
     'bootEnter'
   );

 const boot=
   document.getElementById(
     'boot'
   );

 if(!el||!boot)return;

 let i=0;

 const iv=
   setInterval(
     ()=>{

       if(i<lines.length){

         el.textContent+=
           lines[i]+'\n';

         i++;

       }else{

         clearInterval(iv);

         if(enter)
           enter.style.display=
             'block';
       }

     },
     260
   );

 boot.addEventListener(
   'click',
   ()=>{

     boot.style.opacity='0';

     setTimeout(
       ()=>{
         boot.remove();
       },
       650
     );

   },
   {once:true}
 );

})();
