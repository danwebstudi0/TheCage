<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>THE CAGE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050509;
  --panel:#0b0b12;
  --panel2:#10101a;
  --line:#222232;
  --text:#f3f4f6;
  --muted:#737386;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --green:#22c55e;
  --red:#ef4444;
  --violet:#8b5cf6;
  --violet2:#a78bfa;
  --orange:#f59e0b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.mono,
.finc,
.price,
.cost,
.jitem,
.mini,
.ds,
.inf{
  font-family:monospace;
}

#app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:80px;
}


/* DESKTOP LAYOUT */

@media(min-width:960px){
  #app{max-width:1240px}
  .nav{max-width:1240px}
  .farmGrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .shopStrip{grid-template-columns:repeat(3,minmax(0,1fr))}
}

@media(min-width:1360px){
  .farmGrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .shopStrip{grid-template-columns:repeat(4,minmax(0,1fr))}
}

/* CC-DROP SCENE */

#ccScene{
  position:fixed;
  inset:0;
  z-index:1500;
  display:none;
  background:radial-gradient(ellipse at center,rgba(6,26,14,.55),rgba(3,5,8,.88));
}

#ccScene.on{
  display:block;
}

#ccStage{
  position:absolute;
  inset:0;
  overflow:hidden;
}

  cursor:pointer;
  will-change:transform;
  z-index:1;
  filter:drop-shadow(0 0 18px rgba(34,197,94,.55));
  transition:filter .12s;
  -webkit-user-select:none;
  user-select:none;
}

#ccCoin.tapFx{
  filter:drop-shadow(0 0 34px rgba(74,222,128,.95)) brightness(1.4);
}

#ccCoin .ccTap{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#052e12;
  font:bold 12px monospace;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
  pointer-events:none;
}

#ccOffer{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.92);
  width:min(92vw,360px);
  border:1px solid rgba(34,197,94,.45);
  background:linear-gradient(180deg,#0a1510,#070b0d);
  padding:18px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .5s,transform .5s;
  box-shadow:0 0 50px rgba(34,197,94,.2);
  z-index:2;
}

#ccScene.offer #ccOffer{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

.ccOfferTag{
  color:#4ade80;
  font:9px monospace;
  letter-spacing:2px;
  margin-bottom:12px;
}

.ccCoinBig{
  width:56px;
  height:56px;
  margin:0 auto 10px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font:bold 20px monospace;
  color:#052e12;
  background:radial-gradient(circle at 32% 28%,#bbf7d0,#22c55e 55%,#14532d);
  box-shadow:0 0 22px rgba(34,197,94,.5);
}

.ccValue{
  color:#9ca3af;
  font:8px monospace;
  letter-spacing:1px;
}

.ccValueNum{
  color:#4ade80;
  font:bold 24px monospace;
  margin:5px 0 14px;
}

#ccAdBtn{
  width:100%;
  border:1px solid rgba(34,197,94,.6);
  background:linear-gradient(180deg,rgba(34,197,94,.28),rgba(34,197,94,.1));
  color:#86efac;
  padding:14px;
  font:bold 12px monospace;
}

#ccAdBtn:not(:disabled){
  animation:pulse 1.6s infinite;
}

#ccAdBtn b{
  color:#bbf7d0;
}

#ccTakeBtn{
  width:100%;
  margin-top:8px;
  border:1px solid var(--line);
  background:#0d0d15;
  color:#9ca3af;
  padding:11px;
  font:bold 10px monospace;
}

#ccTakeBtn b{
  color:#d1d5db;
}

#ccTakeBtn .ccNoAd{
  display:block;
  color:#626276;
  font:8px monospace;
  margin-top:3px;
}

.ccHint{
  margin-top:10px;
  color:#626276;
  font:8px monospace;
}

/* TEST AD STUB */

.adTest{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(2,4,3,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.adTestCard{
  width:min(92vw,340px);
  border:1px solid rgba(34,197,94,.4);
  background:#0a120d;
  padding:24px;
  text-align:center;
}

.adTestTag{
  color:var(--orange);
  font:bold 9px monospace;
  letter-spacing:2px;
}

.adTestSpin{
  width:40px;
  height:40px;
  margin:16px auto;
  border:3px solid #14532d;
  border-top-color:#22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.adTestCount{
  color:#4ade80;
  font:bold 28px monospace;
  margin-top:6px;
}

.adTestNote{
  color:var(--muted);
  font:9px monospace;
  margin-top:8px;
}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#030305;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  transition:opacity .6s;
}

.bootBox{
  width:100%;
  max-width:520px;
  border:1px solid #29293b;
  background:#07070d;
  padding:22px;
  box-shadow:0 0 40px rgba(59,130,246,.08);
}

.bootTitle{
  color:var(--blue2);
  font-family:monospace;
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

#bootText{
  color:#8da0bd;
  white-space:pre-line;
  font:12px/1.8 monospace;
}

#bootEnter{
  display:none;
  color:var(--green);
  font:11px monospace;
  margin-top:18px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.3}
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,9,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.headerTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font:bold 18px monospace;
  letter-spacing:.5px;
}

.logo span{
  color:#4ade80;

 ];

 if(!Array.isArray(S.journal))
   S.journal=[];

 S.journal.unshift({

   amount,
   note,
   time:Date.now()
 });

 if(!box)return;

 if(n>=1e9)
   return (n/1e9).toFixed(2)+'B';

 if(n>=1e6)
   return (n/1e6).toFixed(2)+'M';

 if(n>=1e3)
   return (n/1e3).toFixed(1)+'K';

 return ''+n;
}

function fmtT(ms){

 if(ms<=0)
   return '00:00:00';

 const s=Math.floor(ms/1000);

 const h=String(
   Math.floor(s/3600)
 ).padStart(2,'0');

 const m=String(
   Math.floor((s%3600)/60)
 ).padStart(2,'0');

 const ss=String(
   s%60
 ).padStart(2,'0');

 return h+':'+m+':'+ss;
}

let AC=null;

function beep(f){

 try{

   AC=AC||new(
     window.AudioContext||
     window.webkitAudioContext
   )();

   const o=AC.createOscillator();
   const g=AC.createGain();

   o.frequency.value=f||660;
   o.type='square';

   g.gain.value=.03;

   o.connect(g);
   g.connect(AC.destination);

   o.start();

   g.gain.exponentialRampToValueAtTime(
     .0001,
     AC.currentTime+.08
   );

   o.stop(AC.currentTime+.09);

 }catch(e){}
}

/* ================= ECONOMY ================= */

function card(key){
 return CARDS.find(c=>c.key===key);
}

function farmIncome(f){

 const c=card(f.key);

 if(!c)return 0;

 return c.income*
   (1+.35*(f.lvl-1))*
   (f.heat>=100?.3:1);
}

function synergyMult(){

 const cnt={};

 S.farms.forEach(f=>{

   const c=card(f.key);

   if(!c)return;

   cnt[c.rarity]=(cnt[c.rarity]||0)+1;
 });

 const n=Math.max(
   0,
   ...Object.values(cnt)
 );

 return 1+
   .05*
   Math.min(
     Math.max(n-1,0),
     4
   );
}

function personalIncome(){

 return S.farms.reduce(
   (a,f)=>a+farmIncome(f),
   0
 )*synergyMult();
}

function taxOf(node,lvl){

 let t=
   Number(node.income||0)*
   Math.pow(.25,lvl);

 (node.subs||[]).forEach(
   s=>{
     t+=taxOf(s,lvl+1);
   }
 );

 return t;
}

function taxIncome(){

 return S.vassals.reduce(
   (a,v)=>a+taxOf(v,1),
   0
 );
}

function totalIncome(){

 return personalIncome()+taxIncome();
}

function upgradeCost(f){

 const c=card(f.key);

 if(!c)return 0;

 return Math.round(
   c.price*
   .5*
   Math.pow(1.7,f.lvl-1)
 );
}

function botPrice(b){

 return Math.round(
   b.market_value||
   b.income*24||
   240
 );
}

function ransomCost(){

 if(!S.owner)
   return 0;

 const hrs=(Date.now()-S.owner.since)/H;

 return Math.round(
   S.owner.price*
   1.5*
   (1+.02*hrs)
 );
}

function myValue(){

 return Math.round(
   personalIncome()*24
 );
}

function pendingCollect(){

 const elapsed=
   Math.min(
     Math.max(
       Date.now()-S.lastCollect,
       0
     ),
     12*H
   );

 return totalIncome()/H*elapsed;
}

/* реальное серверное время Supabase (по HTTP-заголовку Date),
   с кэшем 5 секунд; при сбое — локальное время */
let SERVER_TIME_OFF=0;
let serverTimeAt=0;

async function serverTime(){

 const now=Date.now();

 if(now-serverTimeAt<5000)
   return now+SERVER_TIME_OFF;

 serverTimeAt=now;

 try{

   const r=
     await fetch(
       SUPABASE_URL+'/rest/v1/players?select=id&limit=1',
       {
         headers:{
           apikey:SUPABASE_KEY,
           Authorization:'Bearer '+SUPABASE_KEY
         }
       }
     );

   const d=r.headers.get('Date');

   if(d){

     const t=new Date(d).getTime();

     if(isFinite(t))
       SERVER_TIME_OFF=t-Date.now();
   }

 }catch(e){}

 return Date.now()+SERVER_TIME_OFF;
}

/* ПАССИВНЫЙ ДОХОД — серверное начисление.
   Капает постоянно, даже когда игрок офлайн:
   дельта считается от серверного last_collect,
   кап — 12 часов. Налог 25% хозяину вычитается. */
async function syncIncomeServer(){

 const id=playerId();

 if(!id)
   return 0;

 try{

   const now=await serverTime();

   const {data:me,error}=
     await sb
       .from('players')
       .select(
         'coins,income,last_collect,vassal_of'
       )
       .eq('id',id)
       .maybeSingle();

   if(error||!me)
     return 0;

   /* первая регистрация — ставим базовые значения */
   if(me.last_collect==null){

     await sb
       .from('players')
       .update({
         coins:Math.floor(S.balance),
         last_collect:now,
         income:Math.floor(totalIncome()),
         market_value:Math.floor(myValue())
       })
       .eq('id',id);

     S.lastCollect=Date.now();

     return 0;
   }

   const last=Number(me.last_collect);

   const elapsed=
     Math.min(
       Math.max(now-last,0),
       12*H
     );

   const inc=Number(me.income||0);

   const gross=inc/H*elapsed;

   let tax=0;

   if(me.vassal_of)
     tax=gross*.25;

   const net=Math.max(0,gross-tax);

   const coins=
     Math.max(
       0,
       Number(me.coins||0)+net
     );

   await sb
     .from('players')
     .update({
       coins:Math.floor(coins),
       last_collect:now
     })
     .eq('id',id);

   S.balance=Math.floor(coins);
   S.lastCollect=Date.now();

   S.stats.collected+=net;

   if(tax>0)
     S.stats.taxesPaid+=tax;

   return net;

 }catch(e){

   console.error(
     'Income sync error:',
     e
   );

   return 0;
 }
}

/* ================= LOAD PLAYER RELATIONS ================= */

async function loadMyRelations(){

 const id=playerId();

 if(!id)return;

 try{

   const hadPrev=S.relationsLoaded===true;

   const prevOwner=S.owner?String(S.owner.id):null;

   const prevVassals=new Set(
     (S.vassals||[]).map(v=>String(v.id))
   );

   const {data:me,error:meError}=
     await sb
       .from('players')
       .select(
         'id,username,vassal_of,created_at'
       )
       .eq('id',id)
       .maybeSingle();

   if(meError){

     console.error(meError);
     return;
   }

   if(!me)return;

   /* OWNER */

   if(me.vassal_of){

     const {data:owner}=
       await sb
         .from('players')
         .select(
           'id,username,income,market_value,created_at'
         )
         .eq(
           'id',
           String(me.vassal_of)
         )
         .maybeSingle();

     if(owner){

       if(
         !S.owner||
         String(S.owner.id)!==
         String(owner.id)
       ){

         S.owner={
           id:String(owner.id),
           name:owner.username||'Игрок',
           price:Number(
             owner.market_value||
             owner.income*24||
             240
           ),
           since:
             S.owner?.since||
             Date.now()
         };

       }

     }

   }else{

     S.owner=null;
   }

   /* VASSALS (уровень 1) */

   const {data:vassals,error:vError}=
     await sb
       .from('players')
       .select(
         'id,username,income,market_value,vassal_of,created_at'
       )
       .eq(
         'vassal_of',
         id
       )
       .limit(100);

   if(vError){

     console.error(vError);

   }else{

     S.vassals=
       (vassals||[]).map(p=>({

         id:String(p.id),

         name:p.username||'Игрок',

         income:Number(p.income||10),

         lvl:1,

         subs:[]

       }));

   }

   /* ПОЛНАЯ ЦЕПЬ: вассалы вассалов (до 3 уровней) */

   const nodeById={};

   S.vassals.forEach(v=>{
     v.subs=[];
     nodeById[v.id]=v;
   });

   let frontier=
     S.vassals.map(v=>v.id);

   for(let d=0;d<2&&frontier.length;d++){

     const {data:rows}=
       await sb
         .from('players')
         .select(
           'id,username,income,vassal_of'
         )
         .in(
           'vassal_of',
           frontier
         )
         .limit(200);

     if(!rows||!rows.length)
       break;

     const next=[];

     rows.forEach(r=>{

       const node={
         id:String(r.id),
         name:r.username||'Игрок',
         income:Number(r.income||10),
         lvl:1,
         subs:[]
       };

       nodeById[node.id]=node;

       const parent=
         nodeById[String(r.vassal_of)];

       if(parent){
         parent.subs.push(node);
         next.push(node.id);
       }

     });

     frontier=next;
   }

   /* УВЕДОМЛЕНИЯ + ЛЕНТА по изменениям */

   if(hadPrev){

     const newOwner=
       S.owner?String(S.owner.id):null;

     if(prevOwner!==newOwner){

       if(newOwner){

         addNotif(
           '⚠ ТЕБЯ КУПИЛ @'+S.owner.name,
           'bad'
         );

         addEvent(
           '@'+S.owner.name+
           ' КУПИЛ ИГРОКА @'+
           playerName()
         );

         histPush('ownedBy',{
           name:S.owner.name,
           time:Date.now()
         });

       }else if(prevOwner){

         addNotif(
           '🔓 ТЫ ВЫРВАЛСЯ ИЗ ЦЕПИ',
           'good'
         );

         addEvent(
           '@'+playerName()+
           ' ВЫРВАЛСЯ ИЗ ЦЕПИ'
         );
       }
     }

     const curVassals=new Set(
       S.vassals.map(v=>String(v.id))
     );

     prevVassals.forEach(vid=>{

       if(!curVassals.has(vid)){

         addNotif(
           '⛓ ОДИН ИЗ ТВОИХ ВАССАЛОВ СБЕЖАЛ',
           'bad'
         );

         addEvent(
           'ВАССАЛ ВЫРВАЛСЯ ИЗ ЦЕПИ @'+
           playerName()
         );
       }
     });

     curVassals.forEach(vid=>{

       if(!prevVassals.has(vid)){

         const v=
           S.vassals.find(
             x=>String(x.id)===vid
           );

         const nm=v?v.name:'?';

         addNotif(
           '⛓ НОВЫЙ ВАССАЛ @'+nm,
           'good'
         );

         addEvent(
           '@'+nm+
           ' СТАЛ ВАССАЛОМ @'+
           playerName()
         );

         histPush('owned',{
           name:nm,
           time:Date.now()
         });
       }
     });
   }

   S.relationsLoaded=true;

   save();

 }catch(e){

   console.error(
     'Relations error:',
     e
   );
 }
}

const ADS_MAX=8;

function todayKey(){
 const d=new Date();
 return d.getFullYear()+'-'+
   String(d.getMonth()+1).padStart(2,'0')+'-'+
   String(d.getDate()).padStart(2,'0');
}

function ensureAds(){

 if(!S.ads||typeof S.ads!=='object')
   S.ads={day:'',used:0};

 if(typeof S.ads.used!=='number')
   S.ads.used=0;

 if(S.ads.day!==todayKey()){
   S.ads.day=todayKey();
   S.ads.used=0;
 }
}

function adsLeft(){
 ensureAds();
 return Math.max(0,ADS_MAX-S.ads.used);
}

/* ТЕКУЩАЯ стоимость монеты CC — всегда из экономики игры.
   Никаких захардкоженных сумм: берём рыночную стоимость игрока
   (доход/час × 24), она растёт вместе с прогрессом. */
function ccCoinValue(){
 return Math.max(1,Math.round(myValue()));
}

/*
  ПРОВАЙДЕР РЕКЛАМЫ.

  Сейчас подключена тестовая заглушка (3 секунды фейковой рекламы).

  Чтобы подключить реальную Rewarded Ad сеть позже —
  замени тело showRewarded() на вызов SDK (Adsgram, Telegram и т.п.):

    showRewarded(){
      return new Promise(resolve=>{
        AdSDK.show({
          onRewarded:()=>resolve(true),
          onClose:()=>resolve(false),
          onError:()=>resolve(false)
        });
      });
    }

  resolve(true)  — реклама досмотрена, начисляем награду;
  resolve(false) — отмена/ошибка, попытка НЕ тратится.
*/
const AdProvider={
 name:'TEST_STUB',
 showRewarded(){
   return new Promise(resolve=>{
     showTestAd(resolve);
   });
 }
};

function showTestAd(done){

 const ov=document.createElement('div');

 ov.className='adTest';

 ov.innerHTML=
   '<div class="adTestCard">'+
     '<div class="adTestTag">РЕКЛАМА · ТЕСТОВЫЙ РЕЖИМ</div>'+
     '<div class="adTestSpin"></div>'+
     '<div class="adTestCount" id="adTestCount">3</div>'+
     '<div class="adTestNote">здесь будет Rewarded Ad</div>'+
   '</div>';

 document.body.appendChild(ov);

 let n=3;

 const iv=setInterval(
   ()=>{

     n--;

     const c=
       document.getElementById(
         'adTestCount'
       );

     if(c)
       c.textContent=n;

     if(n<=0){
       clearInterval(iv);
       ov.remove();
       done(true);
     }

   },
   1000
 );
}

/* ---------- СЦЕНА С МОНЕТОЙ ---------- */

const CCScene={
 active:false,
 raf:null,
 lastTs:0,
 x:40,
 y:80,
 vx:180,
 vy:150,
 rot:0,
 scale:1,
 taps:0,
 tapsNeed:5,
 nextAt:Date.now()+rnd(45000,120000)
};

function ccSetText(id,t){
 const e=document.getElementById(id);
 if(e)e.textContent=t;
}

function ccSetValues(){

 const v=ccCoinValue();
 const t25=Math.max(1,Math.round(v*.25));

 ccSetText(
   'ccValueNum',
   fmt(v)+' C₵'
 );

 ccSetText(
   'ccAdVal',
   '+'+fmt(v)+' C₵'
 );

 ccSetText(
   'ccTakeVal',
   '+'+fmt(t25)+' C₵'
 );

 ccSetText(
   'ccUsed',
   S.ads.used+'/'+ADS_MAX
 );

 ccSetText(
   'ccCount',
   Math.min(S.ads.used+1,ADS_MAX)
 );
}

function ccSetButtons(on){
 const a=document.getElementById('ccAdBtn');
 const b=document.getElementById('ccTakeBtn');
 if(a)a.disabled=!on;
 if(b)b.disabled=!on;
}

function ccBounceLoop(ts){

 if(!CCScene.active)
   return;

 const coin=document.getElementById('ccCoin');
 const stage=document.getElementById('ccStage');

 if(!coin||!stage)
   return;

 if(!CCScene.lastTs)
   CCScene.lastTs=ts;

 let dt=(ts-CCScene.lastTs)/1000;

 CCScene.lastTs=ts;

 if(dt>0.05)
   dt=0.05;

 if(dt<=0){
   CCScene.raf=requestAnimationFrame(ccBounceLoop);
   return;
 }

 const W=stage.clientWidth;
 const H=stage.clientHeight;
 const sz=coin.offsetWidth*CCScene.scale;

 CCScene.x+=CCScene.vx*dt;
 CCScene.y+=CCScene.vy*dt;
 CCScene.rot+=260*dt;

 let sx=1;
 let sy=1;

 if(CCScene.x<=0||CCScene.x>=W-sz){

   CCScene.x=
     Math.max(
       0,
       Math.min(W-sz,CCScene.x)
     );

   CCScene.vx*=-1;
   sx=.82;
   sy=1.14;
 }

 if(CCScene.y<=0||CCScene.y>=H-sz){

   CCScene.y=
     Math.max(
       0,
       Math.min(H-sz,CCScene.y)
     );

   CCScene.vy*=-1;
   sx=1.14;
   sy=.82;
 }

 coin.style.transform=
   'translate('+CCScene.x+'px,'+CCScene.y+'px) '+
   'rotate('+CCScene.rot+'deg) '+
   'scale('+(sx*CCScene.scale)+','+(sy*CCScene.scale)+')';

 CCScene.raf=requestAnimationFrame(ccBounceLoop);
}

function ccTap(){

 if(!CCScene.active)
   return;

 const scene=document.getElementById('ccScene');

 if(!scene)
   return;

 /* после раскрытия предложения тапы больше не нужны */
 if(scene.classList.contains('offer'))
   return;

 CCScene.taps++;

 /* монета растёт с каждым тапом и ускоряется */
 CCScene.scale=
   Math.min(2.4,CCScene.scale+.24);

 CCScene.vx*=1.06;
 CCScene.vy*=1.06;

 const coin=document.getElementById('ccCoin');

 if(coin){

   coin.classList.add('tapFx');

   setTimeout(
     ()=>coin.classList.remove('tapFx'),
     130
   );
 }

 const tc=document.getElementById('ccTapCount');

 if(tc)
   tc.textContent=
     Math.min(CCScene.taps,CCScene.tapsNeed)+
     '/'+CCScene.tapsNeed;

 beep(620+CCScene.taps*90);

 if(CCScene.taps>=CCScene.tapsNeed){

   ccSetValues();
   scene.classList.add('offer');
   beep(660);
 }
}

function openCCScene(){

 if(CCScene.active)
   return;

 ensureAds();

 if(adsLeft()<=0)
   return;

 const scene=
   document.getElementById('ccScene');

 if(!scene)
   return;

 CCScene.active=true;
 CCScene.lastTs=0;
 CCScene.rot=0;
 CCScene.scale=1;
 CCScene.taps=0;

 const W=window.innerWidth;
 const H=window.innerHeight;

 CCScene.x=
   rnd(
     20,
     Math.max(40,W-160)
   );

 CCScene.y=
   rnd(
     60,
     Math.max(90,H*0.35)
   );

 CCScene.vx=
   rnd(130,230)*
   (Math.random()<.5?-1:1);

 CCScene.vy=
   rnd(120,210)*
   (Math.random()<.5?-1:1);

 scene.classList.add('on');
 scene.classList.remove('offer');

 ccSetValues();
 ccSetButtons(true);

 const tc=document.getElementById('ccTapCount');

 if(tc)
   tc.textContent='0/'+CCScene.tapsNeed;

 const coin=
   document.getElementById('ccCoin');

 if(coin){

   coin.style.transform=
     'translate('+
     CCScene.x+
     'px,'+
     CCScene.y+
     'px)';

 }

 CCScene.raf=requestAnimationFrame(ccBounceLoop);

 beep(920);
}

function closeCCScene(){

 CCScene.active=false;

 if(CCScene.raf)
   cancelAnimationFrame(CCScene.raf);

 const scene=
   document.getElementById('ccScene');

 if(scene){
   scene.classList.remove('on');
   scene.classList.remove('offer');
 }
}

async function ccChoose(kind){

 if(!CCScene.active)
   return;

 ensureAds();

 if(adsLeft()<=0){
   closeCCScene();
   return;
 }

 /* суммы считаем в момент выбора —
    всегда актуальная стоимость монеты */
 const v=ccCoinValue();

 if(kind==='ad'){

   ccSetButtons(false);

   const ok=
     await AdProvider.showRewarded();

   if(!ok){
     ccSetButtons(true);
     toast(
       'РЕКЛАМА ОТМЕНЕНА · ПОПЫТКА НЕ ПОТРАЧЕНА',
       'bad'
     );
     return;
   }

   ccGrant(v,'ad');

 }else{

   ccGrant(v,'take');
 }
}

function ccGrant(v,kind){

 ensureAds();

 /* оба варианта тратят одну дневную попытку */
 S.ads.used=
   Math.min(
     ADS_MAX,
     S.ads.used+1
   );

 const amount=
   kind==='ad'?
   v:
   Math.max(1,Math.round(v*.25));

 S.balance+=amount;
 S.stats.collected+=amount;

 persistCoins();
 S.stats.adRewards=(S.stats.adRewards||0)+1;

 if(kind==='ad')
   S.stats.adViews=(S.stats.adViews||0)+1;

 log(
   'CC_DROP',
   amount,
   (
     kind==='ad'?
     'реклама · 100%':
     'монета · 25%'
   )+
   ' · попытка '+
   S.ads.used+
   '/'+ADS_MAX
 );

 toast(
   (
     kind==='ad'?
     '📺 +':
     '🪙 +'
   )+
   fmt(amount)+
   ' C₵ · ПОПЫТКА '+
   S.ads.used+
   '/'+ADS_MAX,
   'good'
 );

 beep(kind==='ad'?1040:880);

 /* следующая сцена — через 90–240 сек реального времени */
 CCScene.nextAt=
   Date.now()+rnd(90000,240000);

 closeCCScene();

 save();
 syncPlayer();
 render();
}

function addNotif(text,kind){

 if(!Array.isArray(S.notifs))
   S.notifs=[];

 S.notifs.unshift({
   text:text,
   kind:kind||'',
   time:Date.now()
 });

 if(S.notifs.length>25)
   S.notifs.length=25;
}

function addEvent(text){

 if(!Array.isArray(S.events))
   S.events=[];

 S.events.unshift({
   text:text,
   time:Date.now()
 });

 if(S.events.length>30)
   S.events.length=30;
}

function histPush(list,item){

 if(!S.history||typeof S.history!=='object')
   S.history={ownedBy:[],owned:[]};

 if(!Array.isArray(S.history[list]))
   S.history[list]=[];

 S.history[list].unshift(item);

 if(S.history[list].length>15)
   S.history[list].length=15;
}

function timeAgo(t){

 const s=
   Math.max(
     0,
     Math.floor(
       (Date.now()-t)/1000
     )
   );

 if(s<60)
   return s+'с назад';

 if(s<3600)
   return Math.floor(s/60)+'м назад';

 if(s<86400)
   return Math.floor(s/3600)+'ч назад';

 return Math.floor(s/86400)+'д назад';
}

function countNodes(nodes){

 let n=0;

 (nodes||[]).forEach(x=>{
   n++;
   n+=countNodes(x.subs||[]);
 });

 return n;
}

/* ---------- ЕЖЕДНЕВНЫЙ БОНУС ---------- */

function yKey(){

 const d=new Date(Date.now()-86400000);

 return d.getFullYear()+'-'+
   String(d.getMonth()+1).padStart(2,'0')+'-'+
   String(d.getDate()).padStart(2,'0');
}

function dailyReward(){

 const streak=(S.daily?.streak||0)+1;

 /* награда из экономики: рыночная стоимость × (0.25 + бонус серии) */
 return Math.max(
   50,
   Math.round(
     myValue()*
     (0.25+Math.min(streak,7)*0.05)
   )
 );
}

function claimDaily(){

 if(!S.daily)
   S.daily={day:'',streak:0};

 if(S.daily.day===todayKey()){

   toast(
     'БОНУС УЖЕ ЗАБРАН СЕГОДНЯ',
     'bad'
   );

   return;
 }

 const streak=
   (S.daily.day===yKey())?
   (S.daily.streak||0)+1:
   1;

 S.daily.day=todayKey();
 S.daily.streak=streak;

 const r=dailyReward();

 S.balance+=r;
 S.stats.collected+=r;

 persistCoins();

 log(
   'DAILY',
   r,
   'серия '+streak+'д'
 );

 addEvent(
   '@'+playerName()+
   ' ЗАБРАЛ ЕЖЕДНЕВНЫЙ БОНУС (СЕРИЯ '+
   streak+'Д)'
 );

 toast(
   '🎁 ЕЖЕДНЕВНЫЙ БОНУС +'+
   fmt(r)+
   ' C₵ · СЕРИЯ '+
   streak+
   'Д',
   'good'
 );

 beep(990);

 save();
 syncPlayer();
 render();
}

/* ---------- ГРАФИК КАПИТАЛА ---------- */

function drawChart(){

 const cv=
   document.getElementById('capChart');

 if(!cv)
   return;

 const dpr=
   window.devicePixelRatio||1;

 const w=cv.clientWidth||300;
 const h=120;

 cv.width=w*dpr;
 cv.height=h*dpr;

 const ctx=cv.getContext('2d');

 ctx.scale(dpr,dpr);
 ctx.clearRect(0,0,w,h);

 const data=S.chart||[];

 if(data.length<2){

   ctx.fillStyle='#626276';
   ctx.font='9px monospace';
   ctx.fillText(
     'НАКАПЛИВАЮТСЯ ДАННЫЕ...',
     8,
     h/2
   );

   return;
 }

 const vals=data.map(p=>p.v);

 const min=Math.min(...vals);
 const max=Math.max(...vals);

 const rng=Math.max(1,max-min);

 ctx.beginPath();

 data.forEach((p,i)=>{

   const x=
     i/(data.length-1)*(w-4)+2;

   const y=
     h-6-
     ((p.v-min)/rng)*(h-20);

   if(i)
     ctx.lineTo(x,y);
   else
     ctx.moveTo(x,y);

 });

 ctx.strokeStyle='#22c55e';
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.lineTo(w-2,h-4);
 ctx.lineTo(2,h-4);
 ctx.closePath();

 ctx.fillStyle='rgba(34,197,94,.12)';
 ctx.fill();

 ctx.fillStyle='#626276';
 ctx.font='8px monospace';

 ctx.fillText(fmt(max),4,10);
 ctx.fillText(fmt(min),4,h-6);
}

const RATINGS={
 t:0,
 rows:[]
};

async function loadRatings(){

 if(Date.now()-RATINGS.t<60000)
   return;

 RATINGS.t=Date.now();

 try{

   const {data,error}=
     await sb
       .from('players')
       .select(
         'id,username,coins,income,market_value,vassal_of'
       )
       .limit(1000);

   if(error){

     console.error(error);
     return;
   }

   const vassalCount={};
   const children={};

   (data||[]).forEach(p=>{

     if(p.vassal_of){

       vassalCount[p.vassal_of]=
         (vassalCount[p.vassal_of]||0)+1;

       (
         children[p.vassal_of]=
         children[p.vassal_of]||[]
       ).push(String(p.id));
     }
   });

   const chainCache={};

   function chainOf(pid){

     if(chainCache[pid]!==undefined)
       return chainCache[pid];

     let total=0;

     const stack=[pid];
     const seen=new Set();

     while(stack.length){

       const cur=stack.pop();

       if(seen.has(cur))
         continue;

       seen.add(cur);

       (children[cur]||[]).forEach(
         ch=>{
           total++;
           stack.push(ch);
         }
       );
     }

     chainCache[pid]=total;

     return total;
   }

   RATINGS.rows=
     (data||[]).map(p=>({

       id:String(p.id),

       name:
         p.username||
         'Игрок',

       coins:
         Number(p.coins||0),

       income:
         Number(p.income||0),

       mv:
         Number(
           p.market_value||0
         ),

       vassals:
         vassalCount[p.id]||0,

       chain:
         chainOf(String(p.id))
     }));

   renderRatings();

 }catch(e){

   console.error(e);
 }
}

/* ================= GAME LOOP ================= */

async function tick(){

 const now=Date.now();

 let dt=
   now-S.lastReal;

 if(dt<0||dt>60000)
   dt=1000;

 S.lastReal=now;

 S.v+=
   dt*S.speed;

 S.farms.forEach(
   f=>{

     if(f.heat<100){

       f.heat=
         Math.min(
           100,
           f.heat+
           dt*
           S.speed*
           100/
           86400000
         );
     }

   }
 );

 if(
   S.v-S.lastMarket>
   30000
 ){

   S.lastMarket=S.v;

   loadRealMarket();
 }

 const unprotected=
   Date.now()>S.shieldUntil&&
   Date.now()>S.immunity;

 if(
   unprotected&&
   Date.now()>S.nextRaid&&
   personalIncome()>=30
 ){

   if(Math.random()<.5){

     doRaid();

   }else{

     S.nextRaid=
       Date.now()+
       H;
   }
 }
 /* график капитала: точка каждые 30с, держим 2 часа */
 if(now-(S.chartLast||0)>30000){
   S.chartLast=now;
   S.chart.push({t:now,v:Math.round(S.balance)});
   if(S.chart.length>240)
     S.chart.shift();
 }

 /* достижения */
 checkAchievements();

 /* CC-DROP: реальное время, не игровое */
 ensureAds();

 if(
   !CCScene.active&&
   !document.getElementById('boot')&&
   adsLeft()>0&&
   Date.now()>=CCScene.nextAt
 ){
   openCCScene();
 }

 render();
}

(function(){

 const lines=[
   '> THE CAGE v1.0 // NODE BOOT',
   '> авторизация Telegram......OK',
   '> Supabase connection.......READY',
   '> реестр игроков............READY',
   '> рынок реальных игроков....READY',
   '> щит новичка активирован...1Ч',
   '> ДОБРО ПОЖАЛОВАТЬ В ЦЕПЬ, ОПЕРАТОР'
 ];

 const el=
   document.getElementById(
     'bootText'
   );

 const enter=
   document.getElementById(
     'bootEnter'
   );

 const boot=
   document.getElementById(
     'boot'
   );

 if(!el||!boot)return;

 let i=0;

 const iv=
   setInterval(
     ()=>{

       if(i<lines.length){

         el.textContent+=
           lines[i]+'\n';

         i++;

       }else{

         clearInterval(iv);

         if(enter)
           enter.style.display=
             'block';
       }

     },
     260
   );

 boot.addEventListener(
   'click',
   ()=>{

     boot.style.opacity='0';

     setTimeout(
       ()=>{
         boot.remove();
       },
       650
     );

   },
   {once:true}
 );

})();
