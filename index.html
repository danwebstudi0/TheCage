<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>THE CAGE</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050509;
  --panel:#0b0b12;
  --panel2:#10101a;
  --line:#222232;
  --text:#f3f4f6;
  --muted:#737386;
  --blue:#3b82f6;
  --blue2:#60a5fa;
  --green:#22c55e;
  --red:#ef4444;
  --violet:#8b5cf6;
  --violet2:#a78bfa;
  --orange:#f59e0b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.mono,
.finc,
.price,
.cost,
.jitem,
.mini,
.ds,
.inf{
  font-family:monospace;
}

#app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:80px;
}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#030305;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  transition:opacity .6s;
}

.bootBox{
  width:100%;
  max-width:520px;
  border:1px solid #29293b;
  background:#07070d;
  padding:22px;
  box-shadow:0 0 40px rgba(59,130,246,.08);
}

.bootTitle{
  color:var(--blue2);
  font-family:monospace;
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

#bootText{
  color:#8da0bd;
  white-space:pre-line;
  font:12px/1.8 monospace;
}

#bootEnter{
  display:none;
  color:var(--green);
  font:11px monospace;
  margin-top:18px;
  animation:blink 1s infinite;
}

@keyframes blink{
  50%{opacity:.3}
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,9,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.headerTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font:bold 18px monospace;
  letter-spacing:2px;
}

.logo span{
  color:var(--red);
}

.balance{
  color:var(--blue2);
  font:bold 16px monospace;
}

.headerStats{
  display:flex;
  gap:8px;
  margin-top:9px;
  flex-wrap:wrap;
}

.hstat{
  border:1px solid var(--line);
  background:var(--panel);
  padding:6px 9px;
  font:10px monospace;
  color:#9ca3af;
}

.hstat b{
  color:#fff;
}

#hIncome{
  color:var(--green);
}

#hShield{
  color:var(--green);
}

#hShield.none{
  color:var(--red);
}

/* SCREENS */

.screen{
  display:none;
  padding:12px;
}

.screen.active{
  display:block;
}

/* PANELS */

.panel{
  border:1px solid var(--line);
  background:var(--panel);
  padding:13px;
  margin-bottom:12px;
}

.ptitle{
  font:10px monospace;
  color:#9292a8;
  letter-spacing:1.2px;
  margin-bottom:10px;
}

.sectTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:15px 0 8px;
  font:bold 10px monospace;
  color:#8d8da0;
  letter-spacing:1px;
}

.mini{
  color:var(--muted);
  font-size:9px;
}

/* BUTTONS */

#collectBtn{
  width:100%;
  border:1px solid rgba(34,197,94,.45);
  background:rgba(34,197,94,.08);
  color:var(--green);
  padding:14px;
  font:bold 13px monospace;
}

#collectBtn.pulse{
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{
    box-shadow:0 0 22px rgba(34,197,94,.22);
  }
}

.fbtn,
.buyBtn,
.dangerBtn{
  border:1px solid var(--line);
  background:#11111b;
  color:#d1d5db;
  padding:9px 12px;
  font:bold 10px monospace;
}

.fbtn.primary,
.buyBtn{
  border-color:rgba(59,130,246,.4);
  color:var(--blue2);
  background:rgba(59,130,246,.07);
}

.fbtn.hot,
.dangerBtn{
  border-color:rgba(239,68,68,.4);
  color:#f87171;
  background:rgba(239,68,68,.06);
}

.dangerBtn{
  width:100%;
  margin-top:10px;
  padding:13px;
}

#speedBtn{
  position:fixed;
  right:12px;
  bottom:72px;
  z-index:60;
  border:1px solid #303044;
  background:#0b0b12;
  color:#9ca3af;
  padding:9px 11px;
  font:bold 10px monospace;
}

#speedBtn.on{
  color:var(--orange);
  border-color:rgba(245,158,11,.5);
}

/* CAPACITY */

#capBar{
  height:5px;
  background:#191923;
  margin-top:10px;
  overflow:hidden;
}

#capFill{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--violet));
}

.capLabel{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font:8px monospace;
  margin-top:5px;
}

/* OWNER */

.ownerBanner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.05);
  padding:12px;
  margin-bottom:12px;
}

.ownerBanner .t{
  color:#f87171;
  font:bold 11px monospace;
}

.ownerBanner .s{
  color:var(--muted);
  font:8px monospace;
  margin-top:4px;
}

/* FARMS */

.farmGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.fcard{
  position:relative;
  border:1px solid color-mix(in srgb,var(--rc) 35%,#222);
  background:var(--panel);
  padding:11px;
  overflow:hidden;
}

.fcard.overheat{
  border-color:rgba(239,68,68,.5);
}

.flvl{
  color:var(--rc);
  font:bold 9px monospace;
}

.fname{
  color:#fff;
  font:bold 11px monospace;
  margin-top:5px;
}

.frar{
  color:var(--rc);
  font:8px monospace;
  letter-spacing:1px;
  margin-top:3px;
}

.finc{
  color:var(--blue2);
  font:bold 12px monospace;
  margin-top:8px;
}

.heatBar{
  height:4px;
  background:#191923;
  margin-top:9px;
}

.heatFill{
  height:100%;
  background:var(--orange);
}

.heatLabel{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font:7px monospace;
  margin-top:4px;
}

.fbtns{
  display:flex;
  gap:5px;
  margin-top:9px;
}

.fbtns .fbtn{
  flex:1;
}

/* SHOP */

.shopStrip{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}

.scard{
  background:#090910;
  padding:10px;
}

/* MARKET */

.mcard{
  border:1px solid var(--line);
  background:var(--panel);
  padding:12px;
  margin-bottom:8px;
}

.mcard .top,
.mcard .mid,
.mcard .bot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.mcard .nm{
  font:bold 10px monospace;
}

.st{
  font:bold 8px monospace;
}

.online{
  color:var(--green);
}

.mcard .mid{
  color:var(--muted);
  font:9px monospace;
  margin-top:10px;
}

.mcard .mid b{
  color:#ddd;
}

.mcard .bot{
  margin-top:11px;
}

.pr{
  color:var(--violet2);
  font:bold 12px monospace;
}

/* CHAIN */

.chainNode{
  border-left:2px solid var(--violet);
  background:var(--panel);
  padding:11px;
  margin-bottom:6px;
}

.chainNode.l2{
  margin-left:18px;
  border-left-color:#475569;
}

.chainNode .nm{
  font:bold 11px monospace;
}

.inf{
  color:var(--muted);
  font-size:8px;
  margin-top:5px;
}

.inf b{
  color:var(--green);
}

.freeNode{
  border:1px solid rgba(34,197,94,.25);
  background:rgba(34,197,94,.04);
  color:var(--green);
  padding:12px;
  font:bold 10px monospace;
  margin-bottom:12px;
}

.ransomPanel{
  border:1px solid rgba(239,68,68,.3);
  background:rgba(239,68,68,.04);
  padding:13px;
  margin-bottom:12px;
}

.cost{
  color:#f87171;
  font:bold 18px monospace;
}

.refBox{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.refBox .link{
  min-width:0;
  flex:1;
  border:1px solid var(--line);
  background:#06060b;
  padding:10px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:#7f8799;
  font:8px monospace;
}

/* SHIELDS */

.shieldRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid var(--line);
  padding:11px 0;
}

.shieldRow .nm{
  font:bold 11px monospace;
}

.shieldRow .ds{
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

/* STATS */

.statGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  border-top:1px solid var(--line);
  border-left:1px solid var(--line);
}

.statCell{
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:12px;
}

.statCell .v{
  color:#fff;
  font:bold 16px monospace;
}

.statCell .l{
  color:var(--muted);
  font:8px monospace;
  margin-top:3px;
}

/* JOURNAL */

.jitem{
  display:flex;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding:8px 0;
  font-size:9px;
}

.nt{
  color:#9ca3af;
}

.plus{
  color:var(--green);
}

.minus{
  color:var(--red);
}

/* TOAST */

#toasts{
  position:fixed;
  left:12px;
  right:12px;
  top:70px;
  z-index:1000;
  pointer-events:none;
}

.toast{
  max-width:500px;
  margin:0 auto 7px;
  border:1px solid #333343;
  background:#11111a;
  padding:10px;
  color:#ddd;
  font:bold 10px monospace;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.toast.good{
  border-color:rgba(34,197,94,.4);
  color:var(--green);
}

.toast.bad{
  border-color:rgba(239,68,68,.4);
  color:#f87171;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:55;
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:rgba(7,7,12,.97);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

.tab{
  border:0;
  background:transparent;
  color:#626276;
  padding:11px 4px;
  font:bold 9px monospace;
}

.tab.active{
  color:var(--blue2);
}

@media(max-width:420px){
  .farmGrid,
  .shopStrip{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<script>
'use strict';

/* ================= DATA ================= */

const CARDS=[
 {key:'home_server',name:'ДОМАШНИЙ СЕРВЕР',rarity:'common',income:10,price:500},
 {key:'usb_miner',name:'USB-МАЙНЕР',rarity:'common',income:25,price:1200},
 {key:'garage_node',name:'ГАРАЖНЫЙ УЗЕЛ',rarity:'common',income:60,price:2800},
 {key:'datacenter_rack',name:'СТОЙКА ДЦ',rarity:'rare',income:150,price:7500},
 {key:'neuro_client',name:'НЕЙРО-КЛИЕНТ',rarity:'rare',income:380,price:19000},
 {key:'quantum_module',name:'КВАНТОВЫЙ МОДУЛЬ',rarity:'rare',income:900,price:48000},
 {key:'bunker_farm',name:'БУНКЕРНАЯ ФЕРМА',rarity:'epic',income:2200,price:125000},
 {key:'ai_core',name:'AI CORE',rarity:'epic',income:5500,price:320000},
 {key:'orbital_relay',name:'ОРБИТАЛЬНЫЙ РЕТРАНСЛЯТОР',rarity:'epic',income:14000,price:850000},
 {key:'syndicate_core',name:'ЯДРО СИНДИКАТА',rarity:'legendary',income:40000,price:2600000},
 {key:'protocol_zero',name:'ПРОТОКОЛ НОЛЬ',rarity:'legendary',income:120000,price:9000000}
];

const RARITY={
 common:{label:'ОБЫЧНЫЙ',color:'#7C8DA6'},
 rare:{label:'РЕДКИЙ',color:'#3B82F6'},
 epic:{label:'ЭПИЧЕСКИЙ',color:'#8B5CF6'},
 legendary:{label:'ЛЕГЕНДАРНЫЙ',color:'#E879F9'}
};

const SHIELDS=[
 {key:'basic',label:'BASIC',desc:'1 час защиты',h:1,mult:2},
 {key:'standard',label:'STANDARD',desc:'3 часа защиты',h:3,mult:5},
 {key:'advanced',label:'ADVANCED',desc:'5 часов защиты',h:5,mult:8},
 {key:'fortress',label:'FORTRESS',desc:'10 часов защиты',h:10,mult:14},
 {key:'citadel',label:'CITADEL',desc:'24 часа защиты',h:24,mult:28}
];

const LORDS=[
 'NULLPOINTER','SYND1KAT','OV3RLORD','DARKNODE','KASSANDRA_0',
 'R00TK1T','V0IDRUNNER','0BSERVER','M0N0L1T','HEXFATHER'
];

const SAVE_KEY='thecage_save_v1';

const SUPABASE_URL='https://onjtrzpcehdjhutxfqby.supabase.co';
const SUPABASE_KEY='sb_publishable_K705CYyjxaP7bc0F-uL3cg_y6PD5F92';

const sb=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const tg=window.Telegram?.WebApp;

tg?.ready();
tg?.expand();

const H=3600000;

/* ================= USER ================= */

function tgUser(){
 return tg?.initDataUnsafe?.user || null;
}

function playerId(){
 const u=tgUser();
 return u ? String(u.id) : null;
}

function playerName(){
 const u=tgUser();
 return u?.username || u?.first_name || 'Игрок';
}

/* ================= STATE ================= */

function genCode(){
 const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let s='';
 for(let i=0;i<5;i++){
   s+=c[Math.floor(Math.random()*c.length)];
 }
 return s;
}

function defaultState(){

 const now=Date.now();

 return {
   v:now,
   speed:1,
   lastReal:now,
   balance:250,
   lastCollect:now,

   farms:[
     {
       key:'home_server',
       lvl:1,
       heat:0,
       cd:0
     }
   ],

   vassals:[],
   owner:null,

   immunity:0,
   shieldUntil:now+24*H,
   shieldTier:'NOVICE',
   shieldCd:0,
   allCd:0,

   refCode:genCode(),
   refCount:0,

   bots:[],
   nextRaid:now+26*H,
   lastMarket:now,

   stats:{
     collected:0,
     taxesEarned:0,
     taxesPaid:0,
     purch:0,
     ransoms:0,
     raids:0
   },

   journal:[]
 };
}

let S=load();

function load(){

 try{

   const raw=
     localStorage.getItem(SAVE_KEY);

   if(raw){

     const s=JSON.parse(raw);

     const d=defaultState();

     s.lastReal=Date.now();

     if(!s.refCode)
       s.refCode=d.refCode;

     if(!Array.isArray(s.vassals))
       s.vassals=[];

     if(!Array.isArray(s.farms))
       s.farms=d.farms;

     if(!Array.isArray(s.journal))
       s.journal=[];

     if(!Array.isArray(s.bots))
       s.bots=[];

     if(!s.stats)
       s.stats=d.stats;

     if(typeof s.speed!=='number')
       s.speed=1;

     if(typeof s.balance!=='number')
       s.balance=250;

     if(typeof s.lastCollect!=='number')
       s.lastCollect=Date.now();

     if(typeof s.shieldUntil!=='number')
       s.shieldUntil=Date.now()+24*H;

     if(typeof s.shieldCd!=='number')
       s.shieldCd=0;

     if(typeof s.allCd!=='number')
       s.allCd=0;

     if(typeof s.immunity!=='number')
       s.immunity=0;

     if(typeof s.nextRaid!=='number')
       s.nextRaid=Date.now()+26*H;

     return s;
   }

 }catch(e){

   console.error(
     'LOAD ERROR',
     e
   );

 }

 return defaultState();
}

function save(){

 S.savedReal=Date.now();

 try{

   localStorage.setItem(
     SAVE_KEY,
     JSON.stringify(S)
   );

 }catch(e){}
}

/* ================= HELPERS ================= */

function rnd(a,b){
 return a+Math.random()*(b-a);
}

function pick(arr){
 return arr[
   Math.floor(
     Math.random()*arr.length
   )
 ];
}

function log(type,amount,note){

 if(!Array.isArray(S.journal))
   S.journal=[];

 S.journal.unshift({
   type,
   amount,
   note,
   time:Date.now()
 });

 if(S.journal.length>30)
   S.journal.length=30;
}

function toast(msg,kind){

 const box=
   document.getElementById('toasts');

 if(!box)return;

 const d=
   document.createElement('div');

 d.className=
   'toast'+
   (kind?' '+kind:'');

 d.textContent=msg;

 box.appendChild(d);

 setTimeout(
   ()=>d.remove(),
   3200
 );
}

function fmt(n){

 n=Math.floor(Number(n)||0);

 if(n>=1e9)
   return (n/1e9).toFixed(2)+'B';

 if(n>=1e6)
   return (n/1e6).toFixed(2)+'M';

 if(n>=1e3)
   return (n/1e3).toFixed(1)+'K';

 return ''+n;
}

function fmtT(ms){

 if(ms<=0)
   return '00:00:00';

 const s=
   Math.floor(ms/1000);

 const h=String(
   Math.floor(s/3600)
 ).padStart(2,'0');

 const m=String(
   Math.floor((s%3600)/60)
 ).padStart(2,'0');

 const ss=String(
   s%60
 ).padStart(2,'0');

 return h+':'+m+':'+ss;
}

let AC=null;

function beep(f){

 try{

   AC=AC||
     new(
       window.AudioContext||
       window.webkitAudioContext
     )();

   const o=
     AC.createOscillator();

   const g=
     AC.createGain();

   o.frequency.value=f||660;
   o.type='square';

   g.gain.value=.03;

   o.connect(g);
   g.connect(AC.destination);

   o.start();

   g.gain.exponentialRampToValueAtTime(
     .0001,
     AC.currentTime+.08
   );

/* ================= ECONOMY ================= */

function card(key){
 return CARDS.find(
   c=>c.key===key
 );
}

function farmIncome(f){

 const c=card(f.key);

 if(!c)return 0;

 return c.income*
   (1+.35*(f.lvl-1))*
   (f.heat>=100?.3:1);
}

function synergyMult(){

 const cnt={};

 S.farms.forEach(f=>{

   const c=card(f.key);

   if(!c)return;

   cnt[c.rarity]=
     (cnt[c.rarity]||0)+1;
 });

 const n=Math.max(
   0,
   ...Object.values(cnt)
 );

 return 1+
   .05*
   Math.min(
     Math.max(n-1,0),
     4
   );
}

function personalIncome(){

 return S.farms.reduce(
   (a,f)=>a+farmIncome(f),
   0
 )*synergyMult();
}

function taxOf(node,lvl){

 let t=
   Number(node.income||0)*
   Math.pow(.25,lvl);

 (node.subs||[]).forEach(
   s=>{
     t+=taxOf(s,lvl+1);
   }
 );

 return t;
}

function taxIncome(){

 return S.vassals.reduce(
   (a,v)=>a+taxOf(v,1),
   0
 );
}

function totalIncome(){

 return personalIncome()+
   taxIncome();
}

function upgradeCost(f){

 const c=card(f.key);

 if(!c)return 0;

 return Math.round(
   c.price*
   .5*
   Math.pow(1.7,f.lvl-1)
 );
}

function botPrice(b){

 return Math.round(
   b.market_value||
   b.income*24||
   240
 );
}

function ransomCost(){

 if(!S.owner)
   return 0;

 const hrs=
   (S.v-S.owner.since)/H;

 return Math.round(
   S.owner.price*
   1.5*
   (1+.02*hrs)
 );
}

function myValue(){

 return Math.round(
   personalIncome()*24
 );
}

function pendingCollect(){

 const elapsed=
   Math.min(
     Math.max(
       S.v-S.lastCollect,
       0
     ),
     12*H
   );

 return totalIncome()/H*elapsed;
}

   Math.min(
     Math.max(
       S.v-S.lastCollect,
       0
     ),
     12*H
   );

   personalIncome();

   taxIncome();

   (personal+tax)/
   H*
   elapsed;

 S.balance+=net;

 S.stats.collected+=net;

 S.stats.taxesPaid+=taxPay;

 S.lastCollect=S.v;

 log(
   'COLLECT',
   net,
   S.owner?
   'налог хозяину −'+
   fmt(taxPay):
   ''
 );

 toast(

 render();

/* ================= GAME LOOP ================= */

async function tick(){

 const now=Date.now();

 let dt=
   now-S.lastReal;

 if(dt<0||dt>60000)
   dt=1000;

 S.lastReal=now;

 S.v+=
   dt*S.speed;

 S.farms.forEach(
   f=>{

     if(f.heat<100){

       f.heat=
         Math.min(
           100,
           f.heat+
           dt*
           S.speed*
           100/
           86400000
         );
     }

   }
 );

 if(
   S.v-S.lastMarket>
   30000
 ){

   S.lastMarket=S.v;

   loadRealMarket();
 }

 const unprotected=
   S.v>S.shieldUntil&&
   S.v>S.immunity;

 if(
   unprotected&&
   S.v>S.nextRaid&&
   personalIncome()>=30
 ){

   if(Math.random()<.5){

     doRaid();

   }else{

     S.nextRaid=
       S.v+
       H;
   }
 }

 render();
}

/* ================= BOOT ================= */

(function(){

 const lines=[
   '> THE CAGE v1.0 // NODE BOOT',
   '> авторизация Telegram......OK',
   '> Supabase connection.......READY',
   '> реестр игроков............READY',
   '> рынок реальных игроков....READY',
   '> щит новичка активирован...24Ч',
   '> ДОБРО ПОЖАЛОВАТЬ В ЦЕПЬ, ОПЕРАТОР'
 ];

 const el=
   document.getElementById(
     'bootText'
   );

 const enter=
   document.getElementById(
     'bootEnter'
   );

 const boot=
   document.getElementById(
     'boot'
   );

 if(!el||!boot)return;

 let i=0;

 const iv=
   setInterval(
     ()=>{

       if(i<lines.length){

         el.textContent+=
           lines[i]+'\n';

         i++;

       }else{

         clearInterval(iv);

         if(enter)
           enter.style.display=
             'block';
       }

     },
     260
   );

 boot.addEventListener(
   'click',
   ()=>{

     boot.style.opacity='0';

     setTimeout(
       ()=>{
         boot.remove();
       },
       650
     );

   },
   {once:true}
 );

})();
